name: CI/CD DockerHub Frontend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: dariohuamanconca
          password: ${{ secrets.DOCKERHUB_TOKEN_DARIO }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            dariohuamanconca/as241s5_aej_13-fe:latest
            dariohuamanconca/as241s5_aej_13-fe:${{ github.sha }}
